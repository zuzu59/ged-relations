<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GED Relations{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="/" class="header__title-link">
            <h1 class="header__title">GED Relations</h1>
        </a>
        <button class="header__menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" role="button" tabindex="0">
            <span class="hamburger-icon" aria-hidden="true">☰</span>
        </button>
    </header>

    <!-- Menu overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu">
            <div class="menu__header">
                <h2>GED Relations</h2>
                <button class="menu__close" id="menuClose" aria-label="Fermer le menu">✕</button>
            </div>
            <nav class="menu__nav">
                <a href="/" class="menu__link">
                    <span class="menu__icon">🏠</span> Accueil
                </a>
                <a href="/about" class="menu__link">
                    <span class="menu__icon">ℹ️</span> À propos
                </a>
                <a href="/help" class="menu__link">
                    <span class="menu__icon">❓</span> Aide
                </a>
            </nav>
            <div class="menu__footer">
                <span class="version-info">{{ version }} — {{ date }}</span>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <span class="footer__version">v{{ version }} — {{ date }}</span>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
